# GitHub Actions workflow for IDE Viewer (Go)
#
# Architecture:
#   1. test    — go test + go vet on all platforms
#   2. build   — cross-compile all binaries on single ubuntu runner
#   3. package — platform-specific installer packaging
#   4. release — draft GitHub release on v* tags

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.25.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-portal

jobs:
  # ===========================================
  # Test on all platforms
  # ===========================================
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race ./...
      - run: go vet ./...

  # ===========================================
  # Portal Python tests (pytest)
  # ===========================================
  portal-test:
    runs-on: ubuntu-latest
    name: Portal Test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r portal/requirements.txt pytest pytest-cov

      - name: Run pytest
        env:
          # conftest.py derives a throwaway '<name>_test' database from this and
          # migrates it with the real Alembic chain, so the suite exercises both
          # the engine we ship and the migrations. It also owns SKIP_DB_INIT and
          # FLASK_CONFIG — don't set them here.
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-key
          PYTHONPATH: portal
        run: pytest tests/ -v

  # ===========================================
  # Cross-compile all binaries
  # ===========================================
  build:
    runs-on: ubuntu-latest
    name: Build Binaries
    needs: [test, portal-test]
    outputs:
      app_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'var Version' internal/version/version.go | cut -d'"' -f2 | sed 's/-dev$//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build all targets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LDFLAGS="-s -w -X github.com/securient/ideviewer-oss/internal/version.Version=${VERSION}"
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ideviewer-linux-amd64     ./cmd/ideviewer/
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ideviewer-linux-arm64     ./cmd/ideviewer/
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ideviewer-darwin-arm64    ./cmd/ideviewer/
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ideviewer-windows-amd64.exe ./cmd/ideviewer/

          echo "Build artifacts:"
          ls -lh dist/

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: binary-linux-amd64
          path: dist/ideviewer-linux-amd64

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: binary-linux-arm64
          path: dist/ideviewer-linux-arm64

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: binary-darwin-arm64
          path: dist/ideviewer-darwin-arm64

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: binary-windows-amd64
          path: dist/ideviewer-windows-amd64.exe

  # ===========================================
  # Package: Linux AMD64 .deb
  # ===========================================
  package-linux-amd64:
    needs: [build]
    runs-on: ubuntu-latest
    name: Package Linux AMD64
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-linux-amd64
          path: bin

      - name: Build .deb
        run: |
          VERSION="${{ needs.build.outputs.app_version }}"
          ARCH="amd64"
          PKG="ideviewer_${VERSION}_${ARCH}"

          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/local/bin"
          mkdir -p "${PKG}/etc/ideviewer"
          mkdir -p "${PKG}/lib/systemd/system"

          cp bin/ideviewer-linux-amd64 "${PKG}/usr/local/bin/ideviewer"
          chmod 755 "${PKG}/usr/local/bin/ideviewer"

          # DEBIAN/control — no leading whitespace allowed
          cat > "${PKG}/DEBIAN/control" <<CTRL
          Package: ideviewer
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Securient <support@securient.com>
          Description: Cross-platform IDE and Extension Scanner
           Scans installed IDEs and extensions for security analysis.
           Detects VS Code, Cursor, JetBrains, Sublime Text, Vim/Neovim.
          Homepage: https://github.com/securient/ideviewer-oss
          CTRL
          sed -i 's/^          //' "${PKG}/DEBIAN/control"

          echo "/etc/ideviewer/config.json" > "${PKG}/DEBIAN/conffiles"

          cat > "${PKG}/etc/ideviewer/config.json" <<'CFG'
          {
            "portal_url": "",
            "customer_key": "",
            "scan_interval_minutes": 60
          }
          CFG
          sed -i 's/^          //' "${PKG}/etc/ideviewer/config.json"

          cat > "${PKG}/lib/systemd/system/ideviewer.service" <<'SVC'
          [Unit]
          Description=IDE Viewer Daemon
          Documentation=https://github.com/securient/ideviewer-oss
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/ideviewer daemon --foreground
          Restart=on-failure
          RestartSec=30
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          SVC
          sed -i 's/^          //' "${PKG}/lib/systemd/system/ideviewer.service"

          # postinst
          cat > "${PKG}/DEBIAN/postinst" <<'SCRIPT'
          #!/bin/bash
          set -e
          mkdir -p /var/log/ideviewer
          chmod 755 /var/log/ideviewer
          systemctl daemon-reload
          echo ""
          echo "IDE Viewer installed. Run: ideviewer register --customer-key KEY --portal-url URL"
          echo ""
          SCRIPT
          sed -i 's/^          //' "${PKG}/DEBIAN/postinst"
          chmod 755 "${PKG}/DEBIAN/postinst"

          # prerm
          cat > "${PKG}/DEBIAN/prerm" <<'SCRIPT'
          #!/bin/bash
          set -e
          systemctl stop ideviewer 2>/dev/null || true
          systemctl disable ideviewer 2>/dev/null || true
          SCRIPT
          sed -i 's/^          //' "${PKG}/DEBIAN/prerm"
          chmod 755 "${PKG}/DEBIAN/prerm"

          # postrm
          cat > "${PKG}/DEBIAN/postrm" <<'SCRIPT'
          #!/bin/bash
          set -e
          systemctl daemon-reload
          if [ "$1" = "purge" ]; then
            rm -rf /etc/ideviewer /var/log/ideviewer
          fi
          SCRIPT
          sed -i 's/^          //' "${PKG}/DEBIAN/postrm"
          chmod 755 "${PKG}/DEBIAN/postrm"

          mkdir -p dist
          dpkg-deb --build --root-owner-group "${PKG}" "dist/ideviewer_${VERSION}_${ARCH}.deb"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: linux-amd64-installer
          path: dist/ideviewer_*.deb

  # ===========================================
  # Package: Linux ARM64 .deb
  # ===========================================
  package-linux-arm64:
    needs: [build]
    runs-on: ubuntu-latest
    name: Package Linux ARM64
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-linux-arm64
          path: bin

      - name: Build .deb
        run: |
          VERSION="${{ needs.build.outputs.app_version }}"
          ARCH="arm64"
          PKG="ideviewer_${VERSION}_${ARCH}"

          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/local/bin"
          mkdir -p "${PKG}/etc/ideviewer"
          mkdir -p "${PKG}/lib/systemd/system"

          cp bin/ideviewer-linux-arm64 "${PKG}/usr/local/bin/ideviewer"
          chmod 755 "${PKG}/usr/local/bin/ideviewer"

          cat > "${PKG}/DEBIAN/control" <<CTRL
          Package: ideviewer
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Securient <support@securient.com>
          Description: Cross-platform IDE and Extension Scanner
           Scans installed IDEs and extensions for security analysis.
           Detects VS Code, Cursor, JetBrains, Sublime Text, Vim/Neovim.
          Homepage: https://github.com/securient/ideviewer-oss
          CTRL
          sed -i 's/^          //' "${PKG}/DEBIAN/control"

          echo "/etc/ideviewer/config.json" > "${PKG}/DEBIAN/conffiles"

          cat > "${PKG}/etc/ideviewer/config.json" <<'CFG'
          {
            "portal_url": "",
            "customer_key": "",
            "scan_interval_minutes": 60
          }
          CFG
          sed -i 's/^          //' "${PKG}/etc/ideviewer/config.json"

          cat > "${PKG}/lib/systemd/system/ideviewer.service" <<'SVC'
          [Unit]
          Description=IDE Viewer Daemon
          Documentation=https://github.com/securient/ideviewer-oss
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/ideviewer daemon --foreground
          Restart=on-failure
          RestartSec=30
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          SVC
          sed -i 's/^          //' "${PKG}/lib/systemd/system/ideviewer.service"

          cat > "${PKG}/DEBIAN/postinst" <<'SCRIPT'
          #!/bin/bash
          set -e
          mkdir -p /var/log/ideviewer
          chmod 755 /var/log/ideviewer
          systemctl daemon-reload
          echo ""
          echo "IDE Viewer installed. Run: ideviewer register --customer-key KEY --portal-url URL"
          echo ""
          SCRIPT
          sed -i 's/^          //' "${PKG}/DEBIAN/postinst"
          chmod 755 "${PKG}/DEBIAN/postinst"

          cat > "${PKG}/DEBIAN/prerm" <<'SCRIPT'
          #!/bin/bash
          set -e
          systemctl stop ideviewer 2>/dev/null || true
          systemctl disable ideviewer 2>/dev/null || true
          SCRIPT
          sed -i 's/^          //' "${PKG}/DEBIAN/prerm"
          chmod 755 "${PKG}/DEBIAN/prerm"

          cat > "${PKG}/DEBIAN/postrm" <<'SCRIPT'
          #!/bin/bash
          set -e
          systemctl daemon-reload
          if [ "$1" = "purge" ]; then
            rm -rf /etc/ideviewer /var/log/ideviewer
          fi
          SCRIPT
          sed -i 's/^          //' "${PKG}/DEBIAN/postrm"
          chmod 755 "${PKG}/DEBIAN/postrm"

          mkdir -p dist
          dpkg-deb --build --root-owner-group "${PKG}" "dist/ideviewer_${VERSION}_${ARCH}.deb"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: linux-arm64-installer
          path: dist/ideviewer_*.deb

  # ===========================================
  # Package: macOS ARM64 .pkg
  # ===========================================
  package-macos:
    needs: [build]
    runs-on: macos-latest
    name: Package macOS ARM64
    env:
      # Signing turns itself on once all the secrets exist. Until then the job
      # still produces an (unsigned) .pkg, so builds and pull requests from
      # forks — which never receive secrets — keep working.
      SIGNING_ENABLED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_INSTALLER_P12 != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-darwin-arm64
          path: dist

      - name: Import signing identities
        if: env.SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MACOS_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" \
            -P "$MACOS_INSTALLER_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          # Without this the tools prompt for keychain access and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # Resolve by SHA-1 rather than name: unambiguous, and it doesn't leak
          # the team name into logs.
          APP_ID=$(security find-identity -v "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          INST_ID=$(security find-identity -v "$KEYCHAIN" | grep "Developer ID Installer" | head -1 | awk '{print $2}')
          if [ -z "$APP_ID" ] || [ -z "$INST_ID" ]; then
            echo "::error::Expected both a Developer ID Application and a Developer ID Installer identity."
            security find-identity -v "$KEYCHAIN" | sed 's/[0-9A-F]\{40\}/<hash>/'
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          echo "MACOS_INSTALLER_IDENTITY=$INST_ID" >> "$GITHUB_ENV"
          echo "Imported Developer ID Application and Installer identities"

      - name: Build .pkg
        env:
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          mv dist/ideviewer-darwin-arm64 dist/ideviewer
          chmod +x dist/ideviewer
          chmod +x build_scripts/build_macos.sh
          ./build_scripts/build_macos.sh

      - name: Notarize and staple
        if: env.SIGNING_ENABLED == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          PKG=$(ls dist/IDEViewer-*.pkg | head -1)
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"

          # --wait blocks until Apple returns a verdict; without it the job would
          # publish an artifact whose notarization might still fail.
          xcrun notarytool submit "$PKG" \
            --key "$RUNNER_TEMP/asc.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/asc.p8"

          # Stapling attaches the ticket to the .pkg so it validates with no
          # network — which is the difference between a clean install and a
          # spinner on conference wifi.
          xcrun stapler staple "$PKG"

      - name: Verify Gatekeeper acceptance
        if: env.SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          PKG=$(ls dist/IDEViewer-*.pkg | head -1)
          pkgutil --check-signature "$PKG"
          xcrun stapler validate "$PKG"
          # The assessment a user's machine performs on download. If this fails,
          # the release must not ship.
          spctl --assess --type install --verbose=4 "$PKG"
          echo "Gatekeeper accepts $PKG"

      - name: Warn when unsigned
        if: env.SIGNING_ENABLED != 'true'
        run: |
          echo "::warning::macOS signing secrets are absent — this .pkg is unsigned and un-notarized, so Gatekeeper will warn users. See the release runbook for the required secrets."

      - name: Clean up keychain
        if: always() && env.SIGNING_ENABLED == 'true'
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Rename with architecture
        run: |
          VERSION="${{ needs.build.outputs.app_version }}"
          PKG_FILE=$(ls dist/IDEViewer-*.pkg 2>/dev/null | head -1)
          if [ -n "$PKG_FILE" ]; then
            mv "$PKG_FILE" "dist/IDEViewer-${VERSION}-arm64.pkg"
          else
            echo "ERROR: No .pkg found" && exit 1
          fi

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: macos-arm64-installer
          path: dist/IDEViewer-*.pkg

  # ===========================================
  # Package: Windows AMD64 .exe installer
  # ===========================================
  package-windows:
    needs: [build]
    runs-on: windows-latest
    name: Package Windows AMD64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-windows-amd64
          path: dist

      - name: Prepare binary
        shell: pwsh
        run: |
          Rename-Item -Path "dist\ideviewer-windows-amd64.exe" -NewName "ideviewer.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAPP_VERSION=${{ needs.build.outputs.app_version }}" build_scripts\windows_installer.iss

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: windows-amd64-installer
          path: dist/IDEViewer-Setup-*.exe

  # ===========================================
  # Portal Docker Image (Multi-arch)
  # ===========================================
  portal-container:
    runs-on: ubuntu-latest
    name: Portal Container
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: ./portal
          file: ./portal/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Release (on v* tags only)
  # ===========================================
  release:
    needs: [package-linux-amd64, package-linux-arm64, package-macos, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.pkg
          draft: false
          generate_release_notes: true
          body: |
            ## Installation

            | Platform | File | Install |
            |----------|------|---------|
            | macOS ARM64 | `IDEViewer-*-arm64.pkg` | `sudo installer -pkg <file> -target /` |
            | Linux AMD64 | `ideviewer_*_amd64.deb` | `sudo dpkg -i <file>` |
            | Linux ARM64 | `ideviewer_*_arm64.deb` | `sudo dpkg -i <file>` |
            | Windows x64 | `IDEViewer-Setup-*.exe` | Run installer |

            ## Portal Container

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
            ## What's New

            **Realtime monitoring covered extensions only, and did not
            actually work.** Two independent problems, both fixed.

            The portal rejected every realtime event the daemon sent.
            `/api/realtime-event` created a scan report and then read
            `report.id` for the package foreign keys without flushing first, so
            the id was still `None` and the insert died on `null value in
            column scan_report_id violates not-null constraint`. Since the
            daemon always attaches dependency data, *every* realtime event came
            back `500`. The filesystem watcher was detecting extension changes
            within its 30s debounce and the portal was discarding all of them,
            so realtime detection did not exist in practice. The endpoint had
            no test coverage at all, which is how it shipped this way.

            The watcher also only watched IDE extension directories. A
            malicious npm package, a new MCP server or a committed credential
            was invisible until the next periodic scan — up to a full scan
            interval. It now watches the rest of the workstation:

            | Category | What it covers |
            |---|---|
            | `extensions` | IDE extension and JetBrains plugin directories |
            | `aitools` | `~/.claude`, `~/.cursor`, `~/.kiro/settings`, openclaw/clawdbot, and the editor `User` settings dirs that hold MCP servers |
            | `projects` | directories containing a dependency manifest — which is also where `.env` files live |

            Events carry the category they came from, so a change triggers only
            the rescan it invalidates: a new extension does not re-walk every
            project, and an edited lockfile does not re-enumerate MCP servers.
            Only manifest-bearing directories are watched, not every directory
            walked — on a developer laptop the walk sees thousands of
            directories but a couple of hundred are projects. `node_modules`
            is excluded: it would cost tens of thousands of watches and buys
            nothing, since an install rewrites the manifest in the project
            directory that is already watched. Discovery stops at 2048
            directories and logs when it does, because each watch costs a file
            descriptor under kqueue and an inotify watch on Linux.

            Measured against a live portal: 333 directories watched, a
            `package.json` edit recorded in ~47s and an AI tool config change
            in ~31s, against up to 30 minutes before.

            **The signed SBOM button returned a 500,** and the SBOM omitted
            every extension.

            Signing was unavailable in any normal local run: the signer decided
            "am I in production?" partly from `not DEBUG`, and `flask run`
            without `--debug` forces `DEBUG = False` even under
            `FLASK_CONFIG=development`. So `./start.sh` was classified as
            production and refused to generate the local key, which also made
            `/api/signing-key` and `/api/enforcement-actions/pending` return
            `503`. Separately, `host_sbom` called the signer unguarded, so a
            portal with no key — a legitimate state — got a bare 500 instead of
            an explanation. It now degrades to a message naming the remedy.

            The SBOM read extensions from the `ExtensionInfo` table, but
            nothing in the codebase has ever written a row to it: ingestion
            populates packages, secrets, vulnerabilities and AI tools only. The
            table is always empty, so every SBOM silently omitted every
            extension — the one inventory this product exists to track. They
            now come from the scan report, reusing the policy engine's own
            flattener so risk levels match what a policy evaluates.

            **Timestamps rendered as "Invalid Date".** Templates built them as
            `isoformat() + 'Z'`, which was right when the columns were naive;
            every `DateTime` column is `timestamptz` now, so `isoformat()`
            already emits an offset and the appended `Z` produced `+00:00Z` —
            two timezone designators, which `new Date()` rejects. This was
            wrong at 7 sites across 5 templates and is now a single filter.

            The host header also labelled `last_seen_at` as "Last seen" while
            `last_heartbeat_at` — the column that actually tracks daemon
            liveness — was never shown anywhere on the page. Heartbeats
            deliberately leave `last_seen_at` alone, so a live daemon with
            nothing new to report looked stale and could not be told apart from
            a dead one. The header now shows an online/idle/offline dot from
            the heartbeat, using the same thresholds as the dashboard, plus the
            report's own timestamp.

            **Also**

            - Secrets and AI tools / MCP servers are recorded from realtime
              events, not just periodic reports. The ingestion is now shared
              between both paths rather than duplicated.
            - The realtime handler takes the scan reservation it always needed.
              It shares the scanner instances with the periodic scan, which the
              pipeline requires be used one at a time, and previously ignored
              that.
            - `COMMAND_SIGNING_PRIVATE_KEY` and its `_FILE` variant are
              documented in the generated `portal/.env`. Bringing your own
              SBOM signing key already worked but was only mentioned in the
              troubleshooting page; left unset, the portal generates one at
              `portal/instance/command_signing.key`.

            > **No migration required.** This release changes no schema.

            > **Known issue.** The daemon's delta check is ineffective: it
            > hashes result structs that embed their own scan timestamp, so the
            > digests always differ and the "skip unchanged cycles" branch is
            > unreachable. Every host therefore re-sends its full inventory
            > each interval. Harmless but wasteful, and it is why the host page
            > says "Last scan" rather than "Last change".
